name: render

# Ручной запуск: рендерит Long (16:9) или Short (9:16) параллельной матрицей кусков и склеивает в один mp4.
# Short собран из озвучки лонга (src/story/short-timeline.json, реплики шортса 001–011), свой звук — src/story/short-sound.json.
# Ключи и .env не нужны: озвучка лежит в public/vo/, шрифты — в public/fonts/.
on:
  workflow_dispatch:
    inputs:
      composition:
        description: 'Композиция: Long (16:9, 13–15 мин) или Short (9:16, ~59 с)'
        type: choice
        options: [Long, Short]
        required: true
        default: Long
      range:
        description: 'Диапазон: lines:001-025 (номера реплик) или frames:0-3212 (кадры). Long весь ролик: lines:001-126; Short весь ролик: lines:001-011 (номера реплик шортса)'
        required: true
        default: 'lines:001-025'
      chunk:
        description: 'Размер куска, кадров'
        required: true
        default: '150'

permissions:
  contents: read

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22.23.4' # как у нас локально (node -v)

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      label: ${{ steps.plan.outputs.label }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Посчитать куски
        id: plan
        env:
          RANGE: ${{ inputs.range }}
          CHUNK: ${{ inputs.chunk }}
          COMP: ${{ inputs.composition }}
        run: |
          TL=src/story/timeline.json
          [ "$COMP" = "Short" ] && TL=src/story/short-timeline.json
          node tools/plan-chunks.mjs --range "$RANGE" --chunk "$CHUNK" --timeline "$TL" --prefix "$COMP" --github-output

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false # упавший кусок не отменяет остальные: его можно перезапустить через «Re-run failed jobs»
      max-parallel: 10
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: ${{ matrix.name }} (${{ matrix.from }}-${{ matrix.to }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Права на бинарники Remotion (ffmpeg, ffprobe, compositor)
        run: |
          find node_modules/@remotion -path '*compositor-*' -type f \( -name ffmpeg -o -name ffprobe -o -name remotion \) -exec chmod +x {} +
          ls -l node_modules/@remotion/compositor-*/ffmpeg node_modules/@remotion/compositor-*/ffprobe
          node_modules/@remotion/compositor-*/ffmpeg -version | head -1
      - name: Системные библиотеки для браузера Remotion
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm-dev libasound2t64 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libcups2 libpango-1.0-0 libcairo2 fonts-liberation
      - name: Кэш браузера Remotion
        uses: actions/cache@v4
        with:
          path: node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx remotion browser ensure
      - name: Пустая подложка для рендера картинки (рендер без звука, настоящий звук собирает join)
        run: |
          mkdir -p public/sfx
          FF=$(node -e "import('./tools/lib.mjs').then(m=>console.log(m.ffbin()))")
          "$FF" -hide_banner -v error -y -f lavfi -i anullsrc=r=32000:cl=stereo -t 1 public/sfx/bed.wav
          cp public/sfx/bed.wav public/sfx/bed_short.wav
      - name: Рендер куска (с одним повтором)
        env:
          NAME: ${{ matrix.name }}
          FROM: ${{ matrix.from }}
          TO: ${{ matrix.to }}
          COMP: ${{ inputs.composition }}
        run: |
          set -u
          mkdir -p out/chunks
          # вкладок столько же, сколько в render.json (long.concurrency = 3), но не больше ядер раннера и не больше 4
          C=$(node -e "const j=JSON.parse(require('fs').readFileSync('src/story/render.json','utf8'));console.log(j[process.env.COMP.toLowerCase()]?.concurrency ?? 3)")
          N=$(nproc); [ "$C" -gt "$N" ] && C=$N
          [ "$C" -gt 4 ] && C=4
          ok=0
          for attempt in 1 2; do
            conc=$C
            [ "$attempt" -eq 2 ] && conc=$(( (C + 1) / 2 )) # повтор — легче: меньше вкладок
            echo "attempt $attempt, tabs $conc"
            if npx remotion render "$COMP" "out/chunks/$NAME.mp4" --frames="$FROM-$TO" --muted --gl=angle \
                 --concurrency="$conc" --crf=18 --log=error --timeout=120000; then
              ok=1
              break
            fi
            echo "::warning::chunk $NAME failed on attempt $attempt"
            rm -f "out/chunks/$NAME.mp4"
          done
          [ "$ok" -eq 1 ] && [ -s "out/chunks/$NAME.mp4" ]
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.name }}
          path: out/chunks/${{ matrix.name }}.mp4
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  join:
    needs: [plan, render]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write # чтобы удалить куски после склейки
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci # ffmpeg лежит внутри Remotion (node_modules/@remotion/compositor-*)
      - name: Права на бинарники Remotion (ffmpeg, ffprobe, compositor)
        run: |
          find node_modules/@remotion -path '*compositor-*' -type f \( -name ffmpeg -o -name ffprobe -o -name remotion \) -exec chmod +x {} +
          ls -l node_modules/@remotion/compositor-*/ffmpeg node_modules/@remotion/compositor-*/ffprobe
          node_modules/@remotion/compositor-*/ffmpeg -version | head -1
      - uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          path: chunks
          merge-multiple: true
      - name: Склеить куски, смешать звук, выровнять до −16 LUFS
        env:
          RANGE: ${{ inputs.range }}
          CHUNK: ${{ inputs.chunk }}
          COUNT: ${{ needs.plan.outputs.count }}
          COMP: ${{ inputs.composition }}
        run: |
          set -eu
          mkdir -p out
          TL=src/story/timeline.json
          [ "$COMP" = "Short" ] && TL=src/story/short-timeline.json
          have=$(ls chunks/*.mp4 | wc -l)
          [ "$have" -eq "$COUNT" ] || { echo "::error::expected $COUNT chunks, found $have"; exit 1; }
          node tools/plan-chunks.mjs --range "$RANGE" --chunk "$CHUNK" --timeline "$TL" --prefix "$COMP" --write-timeline out/timeline_range.json
          FF=$(node -e "import('./tools/lib.mjs').then(m=>console.log(m.ffbin()))")
          (cd chunks && for f in $(ls c*.mp4 | sort); do echo "file '$f'"; done) > chunks/list.txt
          "$FF" -hide_banner -v error -y -f concat -safe 0 -i chunks/list.txt -c copy out/video.mp4
          # звук: подложку (эмбиент + эффекты из src/story/sound.json + вжухи и щелчки из auto-cues.json) собираем здесь
          # по полному timeline.json, потом вырезаем кусок под выбранный диапазон и сводим с голосом диапазона
          if [ "$COMP" = "Short" ]; then
            # шортс: голос лонга уже в short-timeline.json; подложка — по short-sound.json
            BED=public/sfx/bed_short.wav
            node tools/make-sound.mjs src/story/short-timeline.json src/story/short-sound.json "$BED"
          else
            BED=public/sfx/bed.wav
            node tools/check-plans.mjs || echo "check-plans не отработал, берём auto-cues.json из репозитория"
            node tools/make-sound.mjs
          fi
          START=$(node -p "require('./out/timeline_range.json').start")
          TOTAL=$(node -p "require('./out/timeline_range.json').total")
          "$FF" -hide_banner -v error -y -ss "$(node -p "$START / 30")" -t "$(node -p "$TOTAL / 30")" -i "$BED" out/bed_range.wav
          node tools/mix-audio.mjs out/timeline_range.json out/bed_range.wav 1 out/mix.wav
          node tools/loudness.mjs out/mix.wav out/video.mp4 "out/${{ needs.plan.outputs.label }}.mp4" -16
      - name: Проверка готового файла (не блокирует)
        continue-on-error: true
        env:
          CHUNK: ${{ inputs.chunk }}
        run: node tools/check-video.mjs "out/${{ needs.plan.outputs.label }}.mp4" --chunk "$CHUNK"
      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ needs.plan.outputs.label }}
          path: out/${{ needs.plan.outputs.label }}.mp4
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
      - name: Удалить куски (chunk-*) после успешной склейки
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[] | select(.name | startswith("chunk-")) | .id' \
            | while read -r id; do gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" --silent || true; done
